{% extends 'store/base.html' %}

{% block content %}
    <div class="login-container">
        <h1 class="login-title">Login</h1>
        <div class="login-form">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="login-button">
                    <button type="submit">Login</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
